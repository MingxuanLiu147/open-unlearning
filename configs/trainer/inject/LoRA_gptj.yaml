# LoRA for GPT-J
# GPT-J uses separate q/k/v/out_proj for attention (not fused c_attn)

defaults:
  - inject/base_inject@_here_
  - _self_

handler: LoRATrainer

method_args:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - out_proj
  bias: none
  task_type: CAUSAL_LM
