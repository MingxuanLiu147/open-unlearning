# LoRA for ChatGLM4
# ChatGLM uses query_key_value (fused QKV) and dense projection

defaults:
  - inject/base_inject@_here_
  - _self_

handler: LoRATrainer

method_args:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules:
    - query_key_value
    - dense
  bias: none
  task_type: CAUSAL_LM
