# AnyEdit: Unified Multi-Strategy Knowledge Editor
# Based on: https://github.com/TrustedLLM/UnKE (AnyEdit extension)

defaults:
  - edit/base_editor@_here_
  - _self_

handler: AnyEditEditor

method_args:
  layers: [4, 5, 6, 7, 8]
  strategy: "alphaedit"
  v_lr: 0.5
  v_num_grad_steps: 20
  v_weight_decay: 0.5
  v_loss_layer: 31
  clamp_norm_factor: 4.0
  nullspace_threshold: 1.0e-5
  rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
  layer_module_tmp: "model.layers.{}"
  lm_head_module: "lm_head"
  ln_f_module: "model.norm"
  stats_dir: "data/stats"
