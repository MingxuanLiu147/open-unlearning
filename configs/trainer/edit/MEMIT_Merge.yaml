# MEMIT-Merge: Fixing MEMIT Batch Editing for Same-Subject Facts
# ACL 2025 — same-subject key merging restores batch accuracy from 46% to 98%

defaults:
  - edit/base_editor@_here_
  - _self_

handler: MEMITMergeEditor

method_args:
  layers: [4, 5, 6, 7, 8]
  v_lr: 0.5
  v_num_grad_steps: 20
  clamp_norm_factor: 4.0
  edit_weight: 0.5
  merge_threshold: 0.95
  merge_strategy: "mean"
