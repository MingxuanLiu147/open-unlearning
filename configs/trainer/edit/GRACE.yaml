# GRACE: Lifelong Model Editing with Discrete Key-Value Adaptors
# Paper: https://arxiv.org/abs/2211.11031

defaults:
  - edit/base_editor@_here_
  - _self_

handler: GRACEEditor

method_args:
  layers: [9]
  inner_params: "model.layers.9.mlp.down_proj"
  edit_lr: 1.0e-1
  n_iter: 40
  eps: 5.0e-4
  num_pert: 5
  val_reg: 0.0
  dropout: 0.0
  replacement: "replace_last"
