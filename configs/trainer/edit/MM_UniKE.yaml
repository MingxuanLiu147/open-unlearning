# MM-UniKE: Multimodal Unified Knowledge Editing
# Paper: https://arxiv.org/abs/2409.19872 (NeurIPS 2024 Spotlight)

defaults:
  - edit/base_editor@_here_
  - _self_

handler: MMUniKEEditor

method_args:
  layers: [5]
  sentence_model_name: "all-MiniLM-L6-v2"
  k: 5
  v_lr: 0.5
  v_num_grad_steps: 20
  clamp_norm_factor: 4.0
  kl_factor: 0.0625
  mom2_update_weight: 4000.0
  assimilation_weight: 0.5
  accommodation_weight: 0.5
