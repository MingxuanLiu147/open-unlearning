# SFRON: GradDiff + Fisher weight-saliency mask (text analog of MMUnlearner)
# Mask is pre-generated by trainer/unlearn/sfron.py:generate_saliency_mask
# (or SFRON.generate_mask) and loaded via grad_mask_path.
# If grad_mask_path is null/missing, SFRON degrades to plain GradDiff.

defaults:
  - finetune

handler: SFRON
method_args:
  gamma: 1.0
  alpha: 1.0
  retain_loss_type: NLL
  grad_mask_path: null
