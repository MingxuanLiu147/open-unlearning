# Know-Surgery Knowledge Editing 入口配置
# 用于知识编辑任务，支持 ROME, MEMIT, MEND 等方法

defaults:
  - model: Llama-3.2-3B-Instruct
  - trainer: edit/ROME
  - data: edit
  - collator: DataCollatorForSupervisedDataset
  - eval: edit
  - hydra: default
  - paths: default
  - experiment: null
  - _self_

# 训练模式
mode: edit

# 任务名（用于输出目录）
task_name: ???

# 编辑配置
edit_type: single  # single | batch | sequential
max_edits: null
save_edit_summary: true
save_edited_model: true
