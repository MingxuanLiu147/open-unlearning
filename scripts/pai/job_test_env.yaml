protocolVersion: 2
name: test-env-check
type: job
jobRetryCount: 0

prerequisites:
  - type: dockerimage
    uri: "210.75.240.150:30003/liumingxuan/open-unlearning:v1"
    name: docker_image0

taskRoles:
  taskrole:
    instances: 1
    completion:
      minFailedInstances: 1
    taskRetryCount: 0
    dockerImage: docker_image0
    resourcePerInstance:
      gpu: 1
      cpu: 6
      memoryMB: 62500
    commands:
      - "echo === Environment Check ==="
      - "python -c 'import torch; print(torch.__version__, torch.cuda.is_available())'"
      - "python -c 'import transformers; print(transformers.__version__)'"
      - "echo === Storage mounts ==="
      - "ls -la /mnt/ || echo no-mnt"
      - "ls -la /mnt/confignfs/ || echo no-confignfs"
      - "find /mnt -maxdepth 4 -type d | head -30 || true"
      - "echo === Check userdata ==="
      - "ls -la /mnt/confignfs/userdata/liumingxuan/ || echo not-found"
      - "echo === Check usercache ==="
      - "ls -la /mnt/confignfs/usercache/liumingxuan/ || echo not-found"
      - "echo === Check netdisk ==="
      - "ls -la /netdisk/ || echo no-netdisk"
      - "ls -la /netcache/ || echo no-netcache"
      - "echo === GPU ==="
      - "nvidia-smi"
      - "echo === Done ==="

defaults:
  virtualCluster: default

extras:
  com.microsoft.pai.runtimeplugin:
    - plugin: ssh
      parameters:
        jobssh: true
        userssh:
          type: custom
          value: "ssh-rsa  happy-yan"
    - plugin: teamwise_storage
      parameters:
        storageConfigNames:
          - usercache
          - userdata
